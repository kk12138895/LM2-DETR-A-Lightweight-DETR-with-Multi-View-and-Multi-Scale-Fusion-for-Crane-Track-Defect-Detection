__include__: [
  '../../runtime.yml',
  '../include/dfine_hgnetv2.yml',
]

output_dir: ./output/dfine_n_ultra_fps

num_classes: 5

DFINE:
  encoder: HybridEncoder

HGNetv2:
  name: 'B0'
  return_idx: [2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  block_conv: conv
  pretrained: False

HybridEncoder:
  in_channels: [512, 1024]
  feat_strides: [16, 32]
  hidden_dim: 128
  use_encoder_idx: [1]
  dim_feedforward: 512
  expansion: 0.34
  depth_mult: 0.5

DFINETransformer:
  feat_channels: [128, 128]
  feat_strides: [16, 32]
  hidden_dim: 128
  dim_feedforward: 512
  num_levels: 2
  num_layers: 3
  eval_idx: -1
  num_points: [6, 6]

use_ema: False
